services:
  backend:
    build:
      context: ./backend
    environment:
      CACHE_SECONDS: ${CACHE_SECONDS:-600}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
